<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F3EC;
    --ink: #1C1B19;
    --accent: #2B3A67;
    --muted: #8A8578;
    --hover: #F1EEE4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  form {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--muted);
    background: white;
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { background: var(--muted); cursor: default; }

  .status {
    color: var(--muted);
    font-size: 14px;
    margin: 24px 0;
    min-height: 20px;
  }
  .status.error { color: #9A3B3B; }

  .entry {
    border-bottom: 1px solid #E3DFD3;
    padding: 20px 0;
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 14px;
  }
  .entry:first-of-type { padding-top: 0; }

  .rank {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    color: var(--muted);
    padding-top: 3px;
  }
  .entry-title {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 6px;
  }
  .entry-title a {
    color: var(--ink);
    text-decoration: none;
  }
  .entry-title a:hover { color: var(--accent); }

  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .meta .score {
    color: var(--accent);
    font-weight: 500;
  }
  .abstract {
    font-size: 14px;
    line-height: 1.55;
    color: #3E3C37;
    max-width: 62ch;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PaperLens</h1>
      <p class="tagline">Tell it what you're researching. It ranks what to read first.</p>
    </header>

    <form id="search-form">
      <input type="text" id="query" placeholder="e.g. attention mechanisms in transformers" autofocus>
      <button type="submit" id="submit-btn">Search</button>
    </form>

    <div class="status" id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('query');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const submitBtn = document.getElementById('submit-btn');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.results.length) {
        resultsEl.innerHTML = '<div class="empty">No papers with usable abstracts came back for that query. Try rephrasing it.</div>';
        return;
      }
      data.results.forEach((paper, i) => {
        const authors = paper.authors.slice(0, 3).join(', ') + (paper.authors.length > 3 ? ' et al.' : '');
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `
          <div class="rank">${i + 1}</div>
          <div>
            <p class="entry-title"><a href="${escapeHtml(paper.url || '#')}" target="_blank" rel="noopener">${escapeHtml(paper.title)}</a></p>
            <p class="meta">
              <span class="score">${(paper.relevance_score * 100).toFixed(0)}% match</span>
              &nbsp;·&nbsp; ${escapeHtml(authors)}${paper.year ? ' · ' + paper.year : ''}
              &nbsp;·&nbsp; ${paper.citation_count} citations
            </p>
            <p class="abstract">${escapeHtml(paper.abstract.slice(0, 280))}${paper.abstract.length > 280 ? '…' : ''}</p>
          </div>
        `;
        resultsEl.appendChild(entry);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Searching and ranking…';
      resultsEl.innerHTML = '';

      try {
        const res = await fetch(`/search?query=${encodeURIComponent(query)}`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Request failed (${res.status})`);
        }
        const data = await res.json();
        statusEl.textContent = `${data.count} result${data.count === 1 ? '' : 's'} for "${data.query}"`;
        renderResults(data);
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = err.message || 'Something went wrong.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
